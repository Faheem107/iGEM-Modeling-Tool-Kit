# Without this file GitLab falls back to Auto DevOps, which tries to containerise
# the app with Heroku buildpacks. That cannot work on the iGEM runners: they have
# no Docker-in-Docker service, and the buildpack binaries are built for a
# different CPU architecture. Defining a pipeline here replaces Auto DevOps.

image: node:22

stages:
  - build

variables:
  NEXT_TELEMETRY_DISABLED: "1"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

build:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
